<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https://gioalvawiuuvphzilavr.supabase.co; font-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; manifest-src 'none'; worker-src 'none'">
  <meta name="invert-auth-publishable-key" content="sb_publishable_source_candidate_placeholder">
  <title>确认邮箱 | INVERT</title>
  <link rel="canonical" href="https://invertagent.com/zh/auth/confirm/">
  <link rel="stylesheet" href="/assets/index-Rf2Vy7Nv.css">
</head>
<body data-auth-purpose="email" data-locale="zh">
  <div class="auth-frame">
    <header class="auth-header">
      <a class="brand-lockup" href="/zh/" aria-label="INVERT"><span class="brand-word">INVERT</span></a>
    </header>
    <main class="auth-main">
      <section id="auth-panel" class="auth-panel auth-state-ready" aria-live="polite">
        <p class="eyebrow">INVERT 账号</p>
        <h1 id="auth-title">确认这个邮箱</h1>
        <p id="auth-lead" class="auth-lead">只在你主动打开此链接时继续。</p>
        <div class="auth-form">
          <button id="auth-confirm-action" type="button">确认邮箱</button>
        </div>
        <form id="auth-recovery-form" class="auth-form" hidden>
          <label>新密码<input id="auth-password" autocomplete="new-password" name="new-password" spellcheck="false" type="password"></label>
          <label>再次输入新密码<input id="auth-password-confirmation" autocomplete="new-password" name="confirm-password" spellcheck="false" type="password"></label>
          <p>使用 8–64 个字符，并至少包含一个大写英文字母、一个小写英文字母和一个数字。</p>
          <p id="auth-validation" role="alert" hidden></p>
          <button type="submit">确认邮箱</button>
        </form>
        <button id="auth-logout-retry" class="auth-home-link" type="button" hidden>重试</button>
        <div id="auth-progress" class="auth-progress" aria-hidden="true" hidden><span></span></div>
        <div class="auth-form"><p id="auth-manual-return" hidden></p><p id="auth-access-residual" hidden></p></div>
        <noscript><p class="auth-lead">请启用 JavaScript 或返回 INVERT 重新申请链接。</p></noscript>
      </section>
    </main>
    <footer class="auth-footer">
      <span>© 2026 INVERT</span>
      <nav aria-label="Legal">
        <a href="/zh/privacy/">隐私</a>
        <a href="/zh/terms/">条款</a>
        <a href="/zh/contact/">联系</a>
      </nav>
    </footer>
  </div>
  <script type="module" src="/assets/auth-callback-runtime.js"></script>
</body>
</html>
