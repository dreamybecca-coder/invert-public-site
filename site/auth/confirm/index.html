<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https://gioalvawiuuvphzilavr.supabase.co; font-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; manifest-src 'none'; worker-src 'none'">
  <meta name="invert-auth-publishable-key" content="sb_publishable_source_candidate_placeholder">

  <link rel="canonical" href="https://invertagent.com/auth/confirm/">
  <link rel="stylesheet" href="/assets/index-Rf2Vy7Nv.css">

<body data-auth-purpose="email" data-locale="en">
  <div class="auth-frame">
    <header class="auth-header">
      <a class="brand-lockup" href="/" aria-label="INVERT"><span class="brand-word">INVERT</span></a>
    </header>
    <main class="auth-main">
      <section id="auth-panel" class="auth-panel auth-state-ready" aria-live="polite">
        <p class="eyebrow">INVERT Account</p>
        <h1 id="auth-title">Confirm this email</h1>
        <p id="auth-lead" class="auth-lead">Continue only if you opened this link yourself.</p>
        <div class="auth-form">
          <button id="auth-confirm-action" type="button">Confirm email</button>
        </div>
        <form id="auth-recovery-form" class="auth-form" hidden>
          <label>New password<input id="auth-password" autocomplete="new-password" name="new-password" spellcheck="false" type="password"></label>
          <label>Confirm new password<input id="auth-password-confirmation" autocomplete="new-password" name="confirm-password" spellcheck="false" type="password"></label>
          <p>Use 8–64 characters with an uppercase letter, a lowercase letter, and a number.</p>
          <p id="auth-validation" role="alert" hidden></p>
          <button type="submit">Confirm email</button>
        </form>
        <button id="auth-logout-retry" class="auth-home-link" type="button" hidden>Try again</button>
        <div id="auth-progress" class="auth-progress" aria-hidden="true" hidden><span></span></div>
        <div class="auth-form"><p id="auth-manual-return" hidden></p><p id="auth-access-residual" hidden></p></div>
        <noscript><p class="auth-lead">Enable JavaScript or return to INVERT and request a new link.</p></noscript>
      </section>
    </main>
    <footer class="auth-footer">
      <span>© 2026 INVERT</span>
      <nav aria-label="Legal">
        <a href="/privacy/">Privacy</a>
        <a href="/terms/">Terms</a>
        <a href="/contact/">Contact</a>
      </nav>
    </footer>
  </div>
  <script type="module" src="/assets/auth-callback-runtime.js"></script>
</body>
</html>
