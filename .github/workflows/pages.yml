name: Deploy public website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Regenerate production AUTH callbacks
        env:
          NEXT_PUBLIC_INVERT_AUTH_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_INVERT_AUTH_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run export:auth-production
      - name: Verify deployable static site
        env:
          NEXT_PUBLIC_INVERT_AUTH_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_INVERT_AUTH_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run verify
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
